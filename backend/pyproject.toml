[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
# D: = default only, so CI / docker can override with a real Postgres DATABASE_URL.
env = [
    "SECRET_KEY=test-secret-key-not-for-production",
    "DEBUG=False",
    # Pinned (no D: prefix) so tests do not depend on the environment, e.g. U-12 sets
    # NUM_PROXIES=1 in the container; these are the values the throttle/failure tests assume.
    "NUM_PROXIES=0",
    "AUTH_FAIL_AUDIT_PER_MIN=10",
    "AUTH_FAIL_LIMIT_PER_MIN=30",
    "AUTH_THROTTLE_RATE=10/min",
    "AUTH_USERNAME_THROTTLE_RATE=10/min",
    "AUTH_REFRESH_THROTTLE_RATE=60/min",
    "D:DATABASE_URL=sqlite:///:memory:",
]
