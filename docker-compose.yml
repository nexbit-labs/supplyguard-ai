# Root compose: db + backend (U-02), mock-erp + frontend (U-12). Ports overridable via .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplyguard}
      POSTGRES_USER: ${POSTGRES_USER:-supplyguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplyguard}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Dev-only stack: runserver auto-reloads and serves admin static files (gunicorn does not).
    # The backend/Dockerfile CMD is production gunicorn (non-root); see deploy/.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    # Optional .env: passes LOG_LEVEL, JWT_* etc. through. Values in `environment:` win.
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: ${DEBUG:-True}
      # No default on purpose: with DEBUG=False and no SECRET_KEY, settings refuse to start.
      # With DEBUG=True an empty value falls back to a dev-only key.
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://${POSTGRES_USER:-supplyguard}:${POSTGRES_PASSWORD:-supplyguard}@db:5432/${POSTGRES_DB:-supplyguard}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      BEHIND_HTTPS_PROXY: ${BEHIND_HTTPS_PROXY:-False}
      # Placeholder for later tasks (ERP executor); harmless until used.
      MOCK_ERP_URL: ${MOCK_ERP_URL:-http://mock-erp:8081}
      MOCK_ERP_API_KEY: ${MOCK_ERP_API_KEY:-}
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mock-erp:
        condition: service_healthy

  mock-erp:
    build:
      context: .
      dockerfile: mock-erp/Dockerfile
    environment:
      MOCK_ERP_API_KEY: ${MOCK_ERP_API_KEY:-}
      MOCK_ERP_ENABLE_TEST_ENDPOINTS: ${MOCK_ERP_ENABLE_TEST_ENDPOINTS:-true}
      MOCK_ERP_CHAOS_DELAY_SECONDS: ${MOCK_ERP_CHAOS_DELAY_SECONDS:-35}
    ports:
      - "127.0.0.1:${MOCK_ERP_PORT:-8081}:8081"
    # The image defines its own HEALTHCHECK on /health.

  frontend:
    image: node:22.22.2-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      # The browser calls the backend directly (vite proxy is hardcoded to localhost:8000).
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8000}/api/v1}
      VITE_API_MOCK: ${VITE_API_MOCK:-false}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
