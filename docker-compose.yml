# Root compose. U-02 provides db + backend; U-12 adds frontend and mock-erp.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplyguard}
      POSTGRES_USER: ${POSTGRES_USER:-supplyguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplyguard}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Dev-only stack: runserver auto-reloads and serves admin static files (gunicorn does not).
    # Production images use the Dockerfile CMD (gunicorn); see deploy/ in U-12.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    # Optional .env: passes LOG_LEVEL, JWT_* etc. through. Values in `environment:` win.
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: ${DEBUG:-True}
      # No default on purpose: with DEBUG=False and no SECRET_KEY, settings refuse to start.
      # With DEBUG=True an empty value falls back to a dev-only key.
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://${POSTGRES_USER:-supplyguard}:${POSTGRES_PASSWORD:-supplyguard}@db:5432/${POSTGRES_DB:-supplyguard}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
