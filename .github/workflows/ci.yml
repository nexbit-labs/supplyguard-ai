name: CI

on:
  pull_request:
    branches: [collaboration, main]
  push:
    branches: [collaboration, main, "roop/**", "nikhil/**", "uday/**"]
  schedule:
    - cron: "0 2 * * *"   # nightly, runs on the default branch (collaboration)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs and task branches; never cancels a *running* collaboration/main run
  # (GitHub still drops an older pending run in the same group).
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/collaboration' && github.ref != 'refs/heads/main') }}

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: supplyguard
          POSTGRES_PASSWORD: supplyguard
          POSTGRES_DB: supplyguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supplyguard" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Overrides the sqlite default in backend/pyproject.toml (pytest-env "D:" = default only).
      DATABASE_URL: postgres://supplyguard:supplyguard@localhost:5432/supplyguard
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-dummy-secret-key-not-a-real-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check backend exists
        id: has
        run: echo "ok=${{ hashFiles('backend/manage.py') != '' }}" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: actions/setup-python@v5
        if: steps.has.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        if: steps.has.outputs.ok == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        if: steps.has.outputs.ok == 'true'
        run: ruff check .
      # NOTE: `ruff format --check .` is not enabled yet: config/settings.py and manage.py are
      # not format-clean. Run `ruff format backend` (Uday's folder), then add the step.
      - name: Pytest
        if: steps.has.outputs.ok == 'true'
        run: pytest -q

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python-suites:
    name: Python suites (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with scripts/run_checks.py, which auto-detects every top-level <folder>/tests.
        # A new Python suite must be added here too.
        suite: [ai, data, mock-erp]
    steps:
      - uses: actions/checkout@v4
      - name: Check suite has tests
        id: has
        run: echo "ok=${{ hashFiles(format('{0}/tests/**', matrix.suite)) != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.has.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.has.outputs.ok == 'true'
        run: |
          python -m pip install pytest
          for f in "${{ matrix.suite }}/requirements.txt" "${{ matrix.suite }}/requirements-dev.txt"; do
            if [ -f "$f" ]; then python -m pip install -r "$f"; fi
          done
      - name: Pytest (mock-erp runs from its own folder)
        if: steps.has.outputs.ok == 'true'
        run: |
          if [ "${{ matrix.suite }}" = "mock-erp" ]; then
            cd mock-erp && python -m pytest -q tests
          else
            python -m pytest -q "${{ matrix.suite }}/tests"
          fi

  # Single aggregate check to require on main. Steps (not jobs) are skipped when a folder
  # has no code yet, so every job normally ends 'success'; anything else fails the gate.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [backend, frontend, python-suites]
    if: always()
    steps:
      - name: Require all jobs to succeed
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} python-suites=${{ needs.python-suites.result }}"
          [ "${{ needs.backend.result }}" = "success" ] && [ "${{ needs.frontend.result }}" = "success" ] && [ "${{ needs.python-suites.result }}" = "success" ]
