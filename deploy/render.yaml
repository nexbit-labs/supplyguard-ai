# Render Blueprint for SupplyGuard AI.
# UNTESTED until a Render account exists. Secrets are generated by Render (generateValue) or sync: false.
databases:
  - name: supplyguard-db
    databaseName: supplyguard
    user: supplyguard
    postgresMajorVersion: "16"
    plan: free
    ipAllowList: []   # no external connections; the backend uses the internal connection string

services:
  - type: web
    name: supplyguard-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    # Free plan has no preDeployCommand: migrate on start. Render sets $PORT.
    dockerCommand: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: supplyguard-db
          property: connectionString
      # RENDER_EXTERNAL_HOSTNAME is appended to ALLOWED_HOSTS by settings.py; add extra hosts here if any.
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: BEHIND_HTTPS_PROXY
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false            # e.g. https://supplyguard-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # frontend URL, e.g. https://supplyguard-frontend.onrender.com
      - key: MOCK_ERP_URL
        sync: false            # https://supplyguard-mock-erp.onrender.com
      - key: MOCK_ERP_API_KEY
        fromService:
          type: web
          name: supplyguard-mock-erp
          envVarKey: MOCK_ERP_API_KEY
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: supplyguard-mock-erp
    runtime: docker
    dockerfilePath: ./mock-erp/Dockerfile
    dockerContext: .          # repo root: the image copies data/seed
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8081"          # the image listens on 8081
      - key: MOCK_ERP_API_KEY
        generateValue: true    # copy it into the Boomi environment extension
      - key: MOCK_ERP_ENABLE_TEST_ENDPOINTS
        value: "false"
      - key: MOCK_ERP_CHAOS_DELAY_SECONDS
        value: "0"

  - type: web
    name: supplyguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: VITE_API_BASE_URL
        sync: false            # https://supplyguard-backend.onrender.com/api/v1
      - key: VITE_API_MOCK
        value: "false"          # set "true" only to demo the built-in mock API
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
