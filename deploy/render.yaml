# Render Blueprint for SupplyGuard AI.
# UNTESTED until a Render account exists. Secrets use sync: false (set in the dashboard).
databases:
  - name: supplyguard-db
    databaseName: supplyguard
    user: supplyguard
    postgresMajorVersion: "16"
    plan: free

services:
  - type: web
    name: supplyguard-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    preDeployCommand: python manage.py migrate --noinput
    dockerCommand: sh -c "gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 3"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: supplyguard-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false            # e.g. supplyguard-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # frontend URL, e.g. https://supplyguard-frontend.onrender.com
      - key: MOCK_ERP_URL
        sync: false            # https://supplyguard-mock-erp.onrender.com
      - key: MOCK_ERP_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: supplyguard-mock-erp
    runtime: docker
    dockerfilePath: ./mock-erp/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MOCK_ERP_API_KEY
        sync: false            # required when hosted
      - key: MOCK_ERP_ENABLE_TEST_ENDPOINTS
        value: "false"
      - key: MOCK_ERP_CHAOS_DELAY_SECONDS
        value: "0"

  - type: web
    name: supplyguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: VITE_API_BASE_URL
        sync: false            # https://supplyguard-backend.onrender.com/api/v1
      - key: VITE_API_MOCK
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
